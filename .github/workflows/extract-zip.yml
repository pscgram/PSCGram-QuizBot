 
name: Extract PSCGram QuizBot ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract ZIP
        run: |
          mkdir -p extracted
          unzip -o PSCGram-QuizBot-GitHub-Upload.zip -d extracted

          cp -a extracted/. .
          rm -rf extracted
          rm -f PSCGram-QuizBot-GitHub-Upload.zip

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extract PSCGram QuizBot project" || echo "No changes"
          git push
